# The traffic selectors below are the only thing deciding what the phone
# tunnels: Apple's IKEv2 payload carries no routes, and iOS ignores
# split-exclude attributes, so "everything except private space" has to be sent
# as the positive selectors that remain.
#
# They are prefixes rather than ranges deliberately. A selector is a range on
# the wire and the range form is four entries instead of 52, but a client that
# rounds each range up to its smallest covering prefix turns a range spanning
# 10/8 into a 0.0.0.0/1 route and swallows its own LAN. charon's client does
# exactly that.

connections {
  phone {
    version = 2
    pools = phone-pool
    encap = yes
    proposals = aes256gcm16-prfsha384-ecp384
    mobike = yes
    dpd_delay = 1800s
    send_cert = always
    local-1 {
      auth = pubkey
      certs = gotun-gw.pem
      id = vpn.example.net
    }
    remote-1 {
      auth = eap-mschapv2
      eap_id = %any
    }
    children {
      phone {
        if_id_in = 0x61
        if_id_out = 0x61
        local_ts = 1.0.0.0/8,2.0.0.0/7,4.0.0.0/6,8.0.0.0/7,10.231.17.0/24,11.0.0.0/8,12.0.0.0/6,16.0.0.0/4,32.0.0.0/3,64.0.0.0/3,96.0.0.0/6,100.0.0.0/10,100.128.0.0/9,101.0.0.0/8,102.0.0.0/7,104.0.0.0/5,112.0.0.0/5,120.0.0.0/6,124.0.0.0/7,126.0.0.0/8,128.0.0.0/3,160.0.0.0/5,168.0.0.0/8,169.0.0.0/9,169.128.0.0/10,169.192.0.0/11,169.224.0.0/12,169.240.0.0/13,169.248.0.0/14,169.252.0.0/15,169.255.0.0/16,170.0.0.0/7,172.0.0.0/12,172.32.0.0/11,172.64.0.0/10,172.128.0.0/9,173.0.0.0/8,174.0.0.0/7,176.0.0.0/4,192.0.0.0/9,192.128.0.0/11,192.160.0.0/13,192.169.0.0/16,192.170.0.0/15,192.172.0.0/14,192.176.0.0/12,192.192.0.0/10,193.0.0.0/8,194.0.0.0/7,196.0.0.0/6,200.0.0.0/5,208.0.0.0/4
        esp_proposals = aes256gcm16-ecp384
        mode = tunnel
        start_action = none
      }
    }
  }
}

pools {
  phone-pool {
    addrs = 10.231.17.16/28
    dns = 10.231.17.1
  }
}

# No credential here. Add people with:
#
#   gotun ikev2 user add <name>
#
# which writes a 0600 snippet beside this file and prints the password once.
# For a single user with no credential management, by hand:
#
# secrets {
#   eap-iphone {
#     id = iphone
#     secret = <the password you typed into the phone>
#   }
# }
