# Installed as /etc/strongswan.d/gotun-ikev2.conf.
#
# Without this, nothing loads /etc/swanctl/conf.d/*.conf into charon at boot,
# and the IKEv2 transport does not survive a reboot: charon comes up listening
# on 500 and 4500 with no connections at all, so a phone's handshake is refused
# and every indicator looks healthy. Found by rebooting the router -- the one
# check no container reproduces -- after the setup had been working for days on
# state that lived only in tmpfs.
#
# OpenWrt's own mechanism is this same start-script, but it writes it into
# /var/ipsec/strongswan.conf, which /etc/init.d/swanctl generates from UCI
# /etc/config/ipsec. This deployment is swanctl-only and has no such UCI config,
# so config_foreach iterates over nothing and the file is never written -- while
# /var is a symlink to /tmp, so whatever was there is gone on the next boot.
# Nothing else calls swanctl --load-all either: the init script only does so
# from reload_service, never from start.
#
# /etc/strongswan.d/*.conf is included by /etc/strongswan.conf and lives in
# /etc, which is what makes this persistent.
#
# Two includes in the packaged files also point into tmpfs and must be made
# tolerant, or swanctl fails outright rather than warning -- see the README.
charon {
    start-scripts {
        load-all = /usr/sbin/swanctl --load-all --noprompt
    }
}
